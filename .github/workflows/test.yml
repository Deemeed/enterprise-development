name: .NET Build and Test

on:
  push:
    branches:
      - main
      - lab1

  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Carwash/Carwash.slnx

      - name: Build
        run: dotnet build Carwash/Carwash.slnx --no-restore

      - name: Test
        run: dotnet test Carwash/Carwash.slnx --no-restore --configuration Release